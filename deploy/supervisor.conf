[program:trading-market-data]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/llm-trading-bot/artisan queue:work database --queue=market-data --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/llm-trading-bot
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/llm-trading-bot/storage/logs/worker-market-data.log
stopasgroup=true
killasgroup=true

